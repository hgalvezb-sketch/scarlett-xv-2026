  <body>
    <main class="landing" aria-labelledby="pageTitle">
      <div class="monogram" aria-hidden="true">
        <span>XV</span>
      </div>

      <p class="eyebrow">Invitación personal</p>
      <h1 id="pageTitle">Los XV de<br><em>Scarlett Montserrath</em></h1>
      <div class="ornament" aria-hidden="true"><span></span></div>

      <section id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
        <span class="spinner" aria-hidden="true"></span>
        <h2 id="statusTitle">Preparando tu invitación</h2>
        <p id="statusMessage">En un momento podrás ver todos los detalles.</p>
      </section>

      <p class="date">24 · Octubre · 2026</p>

      <noscript>
        <p class="noscript-message">
          Activa JavaScript para abrir tu invitación. Si el problema continúa, solicita nuevamente tu enlace personal.
        </p>
      </noscript>

      <template id="invalidCopy">
        <span>Enlace de invitación no válido</span>
      </template>
    </main>
